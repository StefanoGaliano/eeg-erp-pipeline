[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eegunify"
version = "0.0.1"
description = "Convert any raw EEG recording into one canonical BIDS-EEG format, as the entry point of a single raw-to-ERP pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefano Galiano" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mne>=1.10",
    "mne-bids>=0.16",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "pooch>=1.8",
    "pybv>=0.7.5",
    "edfio>=0.4",
    "eeglabio>=0.0.3",
    "pyxdf>=1.16",
    "defusedxml>=0.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
eegunify = "eegunify.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eegunify"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "PD", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["mne.*", "mne_bids.*", "pybv.*", "edfio.*", "eeglabio.*", "pyxdf.*", "pooch.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "realdata: needs downloaded public EEG data (MNE testing data, ERP CORE)",
    "slow: slow tests",
]
