# ERP CORE N170, all 40 subjects (M-E6b; Kappenman et al., 2021, NeuroImage 225:117465;
# CC-BY-4.0). Same recipe as erpcore_n170.yaml, on the raw recordings of the component's OSF
# project (pfde9) instead of the 5-subject BIDS archive (sub-015's raw file there is identical,
# checked 2026-11-02). Bad channels: automatic (pyprep deviation + HF noise), not ERP CORE's choices.
# Fetch (about 3.9 GB): eegunify fetch erpcore-full -c N170 --dest sourcedata/erpcore
# Face perception: faces, cars, scrambled faces, scrambled cars (80 trials each); the N170 is
# the face-vs-car difference at lateral occipito-temporal sites (P7/PO7, P8/PO8).
schema_version: 1
dataset:
  name: ERP CORE N170
  bids_root: rawdata
  source_root: sourcedata/erpcore/erpcore_full/N170
  task: N170
  authors: [Kappenman ES, Farrens JL, Zhang W, Stewart AX, Luck SJ]
  license: CC-BY-4.0
recordings:
  pattern: "{subject_int}/{subject_int}_N170.set"   # OSF layout: 15/15_N170.set for 015
  subjects: ["001", "002", "003", "004", "005", "006", "007", "008", "009", "010",
             "011", "012", "013", "014", "015", "016", "017", "018", "019", "020",
             "021", "022", "023", "024", "025", "026", "027", "028", "029", "030",
             "031", "032", "033", "034", "035", "036", "037", "038", "039", "040"]
  session: N170
reference:
  online: CMS/DRL (reference-free)   # BioSemi ActiveTwo
  scheme: average                    # offline, ERP phases: average of the EEG channels (N170)
events:
  # Codes from ERP CORE's task-N170_events.json.
  mapping:
    "1-40": stimulus/face
    "41-80": stimulus/car
    "101-140": stimulus/scrambled_face
    "141-180": stimulus/scrambled_car
    "201": response/correct
    "202": response/error
  unmapped: error
  expected_counts:
    stimulus/face: 80
    stimulus/car: 80
    stimulus/scrambled_face: 80
    stimulus/scrambled_car: 80
  count_tolerance: 0.0
  # Stimuli appeared on the LCD monitor 26 ms after their trigger; ERP CORE shifts stimulus
  # (not response) codes by +26 ms (ERPLAB "Shifting Event Codes" tutorial, Luck lab).
  onset_shift_ms:
    "stimulus/*": 26

# --- ERP phases (docs/BLUEPRINT_PHASES.md) -------------------------------------------------------
# Recipe = ERP CORE's own, from Kappenman et al. 2021 (NeuroImage 225:117465), Methods
# (checked against PMC7909723 on 2026-10-31): downsampled to 256 Hz; non-causal Butterworth
# high-pass, half-amplitude cutoff 0.1 Hz, 12 dB/oct; no low-pass on the data that get measured
# (20 Hz only for peak measures and plots); noisy channels spherically interpolated; N170
# referenced to the average of all sites (the other components use P9/P10).
preproc:
  line_noise: {method: none}          # ERP CORE applies no notch
  resample_hz: 256
  highpass_hz: 0.1
  lowpass_hz: null
  filter: {method: iir, iir_order: 2, phase: zero}   # = ERPLAB pop_basicfilter order 2
  # Automatic for all 40 (no channels.tsv in the raw data): pyprep deviation + HF noise
  # (+ gross variance), not RANSAC. Against ERP CORE's 27 hand-picked bad channels, RANSAC
  # matched 0 and added 8 (mostly P9/P10/PO3), deviation + HF noise matched about 10 and
  # added 4 (docs/validation_erp.md).
  bad_channels: {method: pyprep_robust}
  interpolate: true
artifacts:
  method: ica                         # picard (extended infomax) + ICLabel, EOG vote second
  # ERP CORE has no VEOG/HEOG channels, only the three EOG electrodes: derive bipolar ones so the
  # EOG vote and QA ICA_BLINK_RESIDUAL work. VEOG uses Fp2 as the upper site, which leaves Fp1
  # independent for the residual check (VEOG vs Fp1).
  eog_bipolar: {VEOG: [Fp2, VEOG_lower], HEOG: [HEOG_left, HEOG_right]}
  ica:
    # ERP CORE fits ICA without the breaks between blocks (>= 2 s between stimulus codes,
    # 2 s buffers) and without stretches over 400 µV peak-to-peak (500 ms windows, 50 ms
    # step): Script2_ICA_Prep.m and ICA_Prep_Values_N170.xlsx (OSF pfde9). A burst in a break
    # otherwise took 93 % of the PCA variance in sub-035 and ICA kept 2 components.
    fit_exclude: {}
  # Second bad-channel pass on the cleaned data: channels whose median 1 s peak-to-peak is over
  # 2x the median channel's are interpolated after ICA (ERP CORE interpolates after ICA too).
  # Catches channels persistently ~2x noisier than the rest (sub-003 Fp1, sub-033 F7/F8),
  # which pyprep misses; before ICA blinks would flag Fp1/Fp2 everywhere (docs/validation_erp.md).
  post_bad_channels: {max_ptp_ratio: 2.0}
epochs:
  sets:
    stim:
      lock: "stimulus/*"
      tmin_ms: -200
      tmax_ms: 800
      baseline_ms: [-200, 0]
      # ERP CORE averages correct trials only: BDF_N170.txt (OSF pfde9, file cvszm) has bins
      # ".{1-40}{t<200-1000>201}" etc., i.e. a correct response (201) 200-1000 ms after the
      # (shifted) stimulus; README_N170.txt, Script #5 step 3.
      response: {selector: "response/correct", window_ms: [200, 1000]}
  # Blueprint defaults (ERPLAB semantics). ERP CORE tuned thresholds per subject; their values
  # come from their files in M-E6a, not from memory.
  # EEG: the blueprint default (100 µV peak-to-peak, 200 ms windows, 100 ms step).
  # HEOG: ERP CORE's step-function rule on the uncorrected HEOG during the stimulus
  # (AR_Parameters_for_SL_HEOG_Stim_Pres_N170.xlsx, 38 of 40 subjects): 32 µV in -50..350 ms.
  # Their second rule (64 µV over the whole epoch) runs on the ICA-corrected HEOG, which this
  # recipe does not have (ICA does not clean the EOG channels); on the uncorrected HEOG it
  # rejected 127 epochs of sub-010, so it is left out.
  reject:
    method: rules
    rules:
      - {test: ptp, channels: [Fp1, F3, F7, FC3, C3, C5, P3, P7, P9, PO7, PO3, O1, Oz, Pz, CPz, Fp2, Fz, F4, F8, FC4, FCz, Cz, C4, C6, P4, P8, P10, PO8, PO4, O2],
         threshold_uv: 100, win_ms: 200, step_ms: 100}
      - {test: step, channels: [HEOG], threshold_uv: 32, window_ms: [-50, 350], win_ms: 100, step_ms: 10}
conditions:
  face: ["stimulus/face"]
  car: ["stimulus/car"]
  scrambled: ["stimulus/scrambled_face", "stimulus/scrambled_car"]
contrasts:
  face_minus_car: {plus: face, minus: car}
components:
  preset: erpcore
  use: [n170]
group:
  tests: [paired_t, wilcoxon]
  # Face - car is expected negative at PO8 (one-tailed); with 5 subjects 32 sign flips exist, so
  # the smallest possible p is 1/32: reported, labelled underpowered (BLUEPRINT 6.7).
  cluster:
    enabled: true
    contrast: face_minus_car
    tmin_ms: 0
    tmax_ms: 400
    n_permutations: 5000
    tail: -1
  reference_values: erpcore             # compare with ERP CORE's published per-subject values
