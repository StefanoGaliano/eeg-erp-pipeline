# Visual ERP components. `@erpcore` values are from Kappenman et al. 2021, NeuroImage
# 225:117465, Table 1 (sites, reference, difference wave) and Table 2 (recommended measurement
# windows), checked on 2026-10-31 against the PMC author manuscript (PMC7909723).
# `@classic` / `@iscev` values are the literature defaults chosen in docs/BLUEPRINT_PHASES.md
# section 5.2; they are not reproduction targets.

n170@erpcore:
  name: N170
  citation: Kappenman et al. 2021, NeuroImage 225:117465, Tables 1-2
  epoch_set: stim
  contrast: face_minus_car
  window_ms: [110, 150]
  rois: {primary: [PO8], secondary: [P7, PO7, P8]}
  measures: [mean_amplitude, peak_latency, fractional_area_latency]
  polarity: negative
  reference: average
  notes: >-
    Faces minus cars, average of all 33 sites as reference. Stimulus onsets include the
    26 ms LCD delay (applied once, in Phase 1).

n170@classic:
  name: N170
  citation: docs/BLUEPRINT_PHASES.md section 5.2 (literature preset)
  epoch_set: stim
  contrast: face_minus_car
  window_ms: [130, 200]
  rois: {primary: [P7, P8, PO7, PO8]}
  measures: [mean_amplitude, peak_latency]
  polarity: negative
  reference: average

n2pc@erpcore:
  name: N2pc
  citation: Kappenman et al. 2021, NeuroImage 225:117465, Tables 1-2
  epoch_set: stim
  contrast: contra_minus_ipsi
  window_ms: [200, 275]
  rois: {primary: [PO7, PO8]}
  lateralized_pairs: [[PO7, PO8]]
  measures: [mean_amplitude, fractional_area_latency]
  polarity: negative
  reference: P9/P10
  notes: >-
    Contralateral minus ipsilateral to the target. Needs HEOG rejection: eye movements toward
    the target fake an N2pc.

n2pc@classic:
  name: N2pc
  citation: docs/BLUEPRINT_PHASES.md section 5.2 (literature preset)
  epoch_set: stim
  contrast: contra_minus_ipsi
  window_ms: [180, 300]
  rois: {primary: [PO7, PO8]}
  lateralized_pairs: [[PO7, PO8]]
  measures: [mean_amplitude]
  polarity: negative

p1@classic:
  name: P1
  citation: docs/BLUEPRINT_PHASES.md section 5.2 (literature preset; no ERP CORE value)
  epoch_set: stim
  window_ms: [80, 130]
  rois: {primary: [O1, O2, Oz, PO7, PO8]}
  measures: [mean_amplitude, peak_amplitude, peak_latency]
  polarity: positive

n1@classic:
  name: N1
  citation: docs/BLUEPRINT_PHASES.md section 5.2 (literature preset)
  epoch_set: stim
  window_ms: [150, 200]
  rois: {primary: [PO7, PO8]}
  measures: [mean_amplitude, peak_amplitude, peak_latency]
  polarity: negative

vep_p100@iscev:
  name: VEP P100
  citation: ISCEV standard for clinical VEPs (2016 update), pattern reversal
  epoch_set: stim
  window_ms: [90, 130]
  rois: {primary: [Oz]}
  measures: [peak_amplitude, peak_latency]
  polarity: positive
  reference: Fz
  notes: Latency norm about 100 ms; above 115 ms is flagged VEP_LATENCY_ATYPICAL (info).

vep_n75@iscev:
  name: VEP N75
  citation: ISCEV standard for clinical VEPs (2016 update), pattern reversal
  epoch_set: stim
  window_ms: [60, 90]
  rois: {primary: [Oz]}
  measures: [peak_amplitude, peak_latency]
  polarity: negative
  reference: Fz

vep_n135@iscev:
  name: VEP N135
  citation: ISCEV standard for clinical VEPs (2016 update), pattern reversal
  epoch_set: stim
  window_ms: [115, 160]
  rois: {primary: [Oz]}
  measures: [peak_amplitude, peak_latency]
  polarity: negative
  reference: Fz

# Paediatric P100 windows: the 95 % reference limits (2.5th-97.5th percentile) of P100 peak
# time in Thompson DA, Miko-Barath E, Hardy SE, Jando G, Shaw M, Hamilton R (2023), ISCEV
# standard pattern reversal VEP development: paediatric reference limits from 649 healthy
# subjects, Doc Ophthalmol 147:147-164, doi:10.1007/s10633-023-09952-9 (CC-BY-4.0), Table 5,
# read on 2026-11-02. Large checks = 50'/60', small = 12'/15'. The windows are the limits of
# one age band, so a normal peak falls inside. Infant N75/N135 are not tabulated there.
vep_p100@iscev_4mo_large:
  name: VEP P100 (infant, about 4 months, large checks)
  citation: Thompson et al. 2023, Doc Ophthalmol 147:147-164, Table 5, age 17-19 weeks, large checks
  epoch_set: stim
  window_ms: [90, 131]
  rois: {primary: [Oz]}
  measures: [peak_amplitude, peak_latency]
  polarity: positive
  reference: Fz
  notes: Age band 17-19 weeks (4 months = 17.4 weeks); P100 still shortens until 27 weeks.

vep_p100@iscev_4mo_small:
  name: VEP P100 (infant, about 4 months, small checks)
  citation: Thompson et al. 2023, Doc Ophthalmol 147:147-164, Table 5, age 17-19 weeks, small checks
  epoch_set: stim
  window_ms: [111, 170]
  rois: {primary: [Oz]}
  measures: [peak_amplitude, peak_latency]
  polarity: positive
  reference: Fz
  notes: Age band 17-19 weeks; small-check P100 shortens until 34 weeks.

vep_p100@iscev_mature_large:
  name: VEP P100 (after 27 weeks, large checks)
  citation: Thompson et al. 2023, Doc Ophthalmol 147:147-164, Table 5, after the critical age (27 weeks), large checks
  epoch_set: stim
  window_ms: [87, 115]
  rois: {primary: [Oz]}
  measures: [peak_amplitude, peak_latency]
  polarity: positive
  reference: Fz
  notes: Critical age = when the 97.5th percentile is within 1 % of its asymptote (27 weeks).

vep_p100@iscev_mature_small:
  name: VEP P100 (after 34 weeks, small checks)
  citation: Thompson et al. 2023, Doc Ophthalmol 147:147-164, Table 5, after the critical age (34 weeks), small checks
  epoch_set: stim
  window_ms: [96, 131]
  rois: {primary: [Oz]}
  measures: [peak_amplitude, peak_latency]
  polarity: positive
  reference: Fz
  notes: "Critical age for small checks: 34 weeks."
